name: Web Automation Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser (chrome/firefox/edge)'
        required: false
        default: 'chrome'
      tags:
        description: 'Test tags to run (comma-separated: smoke,sanity,regression)'
        required: false
        default: ''
      tests:
        description: 'Specific test IDs to run (comma-separated: TC001,TC002)'
        required: false
        default: ''
      threads:
        description: 'Number of parallel threads'
        required: false
        default: '5'
      env:
        description: 'Environment (qa,staging,prod)'
        required: false
        default: 'qa'
      override_report:
        description: 'Override existing report (true/false)'
        required: false
        default: 'true'

env:
  JAVA_VERSION: '17'
  MAVEN_OPTS: -Xmx1024m

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      selenium:
        image: selenium/standalone-chrome:latest
        ports:
          - 4444:4444
        options: --shm-size="2g"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Get dependencies
        run: mvn dependency:go-offline -B -DskipTests

      - name: Create directories
        run: mkdir -p ExtentReports test-output screenshots

      - name: Compile and Run Tests
        run: |
          echo "=== Compiling project ==="
          mvn clean test-compile -B
          
          echo ""
          echo "=== Running tests ==="
          mvn exec:java -B \
            -Dexec.mainClass="otherTest.TestRunner" \
            -Dtags="${{ github.event.inputs.tags || '' }}" \
            -Dtests="${{ github.event.inputs.tests || '' }}" \
            -Dbrowser="${{ github.event.inputs.browser || 'chrome' }}" \
            -Dthreads="${{ github.event.inputs.threads || '5' }}" \
            -Denv="${{ github.event.inputs.env || 'qa' }}" \
            -DoverrideReport="${{ github.event.inputs.override_report || 'true' }}" \
            -Dparallel="true"

      - name: List generated files
        run: |
          echo "=== ExtentReports contents ==="
          ls -la ExtentReports/ || echo "Directory not found"
          echo ""
          echo "=== Test output contents ==="
          ls -la test-output/ || echo "Directory not found"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: |
            test-output/
            **/*.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Extent Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-reports-${{ github.run_id }}
          path: ExtentReports/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots-${{ github.run_id }}
          path: screenshots/
          retention-days: 14
          if-no-files-found: warn

  test-cross-browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Get dependencies
        run: mvn dependency:go-offline -B -DskipTests

      - name: Create directories
        run: |
          mkdir -p ExtentReports test-output screenshots

      - name: Compile and Run Tests on ${{ matrix.browser }}
        run: |
          echo "=== Compiling project ==="
          mvn clean test-compile -B
          
          echo ""
          echo "=== Running tests on ${{ matrix.browser }} ==="
          mvn exec:java -B \
            -Dexec.mainClass="otherTest.TestRunner" \
            -Dtags="smoke" \
            -Dbrowser="${{ matrix.browser }}" \
            -Dthreads="3" \
            -Denv="qa" \
            -DoverrideReport="true" \
            -Dparallel="true"
        continue-on-error: true

      - name: Upload Results for ${{ matrix.browser }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            test-output/
            ExtentReports/
          retention-days: 7          if-no-files-found: warn
