name: Web Automation Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      tags:
        description: 'Test Tags (smoke,sanity,regression)'
        required: false
        default: ''
      browser:
        description: 'Browser (chrome/firefox)'
        required: false
        default: 'chrome'

jobs:
  smoke-tests:
    name: Smoke Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome]

    services:
      selenium:
        image: selenium/standalone-${{ matrix.browser }}:latest
        ports:
          - 4444:4444
        options: --shm-size="2g"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download dependencies
        run: mvn dependency:go-offline -B -DskipTests

      - name: Create directories
        run: mkdir -p ExtentReports test-output screenshots

      - name: Compile project
        run: mvn test-compile -B -q


      - name: Run Smoke Tests
        run: |
          mvn exec:java -B \
            -Dexec.mainClass="otherTest.TestRunner" \
            -Dexec.classpathScope=test \
            -Dtags=smoke \
            -Dbrowser=${{ matrix.browser }}

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: |
            test-output/
            ExtentReports/
            screenshots/
          retention-days: 14
          if-no-files-found: warn
